; PlatformIO Project Configuration File for ESP32-S3 Receiver Node
;
; Receiver captures CSI data from transmitter packets

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; Bootloader output speed (ROM bootloader uses 74880 baud)
monitor_rts = 0
monitor_dtr = 0

; Override the default and unlock your 16MB Flash (N16)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Override the default and unlock your 8MB PSRAM (R8)
board_build.arduino.memory_type = qio_opi

lib_deps = 
    links2004/WebSockets @ ^2.6.1
